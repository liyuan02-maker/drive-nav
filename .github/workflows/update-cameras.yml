name: 更新測速照相資料

on:
  schedule:
    - cron: "17 19 * * 0"   # 每週一 03:17（台灣時間）
  workflow_dispatch:
  push:
    paths:
      - scripts/update_cameras.py
      - .github/workflows/update-cameras.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_cameras.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cameras.json
          git diff --cached --quiet || (git commit -m "Update speed camera data" && git push)
