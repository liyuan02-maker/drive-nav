name: 更新路段清單

on:
  schedule:
    - cron: "41 19 * * 0"   # 每週一 03:41（台灣時間）
  workflow_dispatch:
  push:
    paths:
      - scripts/update_sections.py
      - .github/workflows/update-sections.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_sections.py
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections.json sections_probe.json
          git diff --cached --quiet || (git commit -m "Update road sections" && git pull --rebase -X theirs -q && git push)
