name: 更新停車場清單

on:
  schedule:
    - cron: "23 20 * * *"   # 每天 04:23（台灣時間）
  workflow_dispatch:
  push:
    paths:
      - scripts/update_parking.py
      - .github/workflows/update-parking.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_parking.py
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking.json parking_probe.json
          git diff --cached --quiet || (git commit -m "Update parking list" && git pull --rebase -X theirs -q && git push)
